# Security headers — included at server level AND in every location that
# declares its own add_header.
#
# nginx does not merge add_header across configuration levels: the moment a
# location block declares a single add_header, it discards everything it
# inherited from the server block. Keeping the rules in one file means the
# cache-serving locations cannot silently drop them, and there is only one
# place to edit.
#
# Note: if the frontend is built with VITE_MAP_TILE_URL set, add that tile
# host to img-src below, otherwise the map background will be blocked.

add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; manifest-src 'self'; worker-src 'self' blob:; script-src 'self' https://sdk.cashfree.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://unpkg.com https://*.cashfree.com; connect-src 'self' https://*.cashfree.com; frame-src https://*.cashfree.com; form-action 'self' https://*.cashfree.com" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
